name: Verify
on:
  pull_request:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Node ${{ matrix.node }} verification
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Install Chromium and Linux libraries
        run: npx --no-install playwright install --with-deps chromium
      - name: Verify code, all harnesses, build and screenshots
        run: npm run verify
      - name: Preserve first report
        run: cp harness/report.json first-report.json
      - name: Repeat all harnesses
        run: npm run harness:all
      - name: Compare reproducible results
        run: node scripts/compare-reports.mjs first-report.json harness/report.json
      - name: Rebuild with the final report and check generated code
        run: npm run build && npm run check
      - name: Upload reports, build and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-node-${{ matrix.node }}
          retention-days: 14
          path: |
            first-report.json
            harness/report.json
            harness/report.md
            dist/atmaraksi-os.html
            docs/screenshots/*.png
